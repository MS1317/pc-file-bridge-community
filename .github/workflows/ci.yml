name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before any build step, so it proves that a fresh clone starts.
      - run: pnpm bridge:smoke
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
