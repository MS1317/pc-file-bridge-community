name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include tokens or MCP URLs that contain a token.** Report security problems privately, as described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: preflight
    attributes:
      label: Output of pnpm preflight:mcp, and any error from the terminal
      render: text
  - type: input
    id: versions
    attributes:
      label: OS, Node.js, pnpm and bridge version
      placeholder: Windows 11, Node 22.17, pnpm 9.15, bridge 0.2.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.1, ChatGPT web, ...
